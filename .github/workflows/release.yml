name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -trimpath -o tokens-au-bucher.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: tokens-au-bucher.exe
