name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -trimpath -o tokens-au-bucher.exe
      - id: hash
        run: echo "sha256=$((Get-FileHash tokens-au-bucher.exe -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          files: tokens-au-bucher.exe
          body: |
            SHA-256: `${{ steps.hash.outputs.sha256 }}`

            Verify with: `Get-FileHash tokens-au-bucher.exe`
